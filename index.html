<style>

  .header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }

  .subtitle { color: var(--text-dim); font-size: 12.5px; }
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 18px 18px;
  }
  .kpi .value { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.15; }

  .kpi .label { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 18px;
  }
  .card h2 { font-size: 12.5px; margin: 0 0 14px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .chart-wrap { position: relative; height: 260px; }
  .search-hint { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
  .gridjs-search { margin-bottom: 12px !important; }
  .gridjs-search-input {
    background: var(--bg) !important; color: var(--text) !important; border: 1px solid var(--accent) !important;
    border-radius: 8px !important; padding: 10px 14px !important; font-size: 14px !important; width: 100% !important; max-width: 420px !important;
  }
  .gridjs-search-input::placeholder { color: var(--text-dim) !important; }
  .gridjs-search-input:focus { outline: none !important; box-shadow: 0 0 0 2px rgba(108,140,255,0.35) !important; }
  .gridjs-wrapper { background: var(--panel) !important; border-radius: 8px !important; border-color: var(--panel-border) !important; }
  table.gridjs-table { font-size: 12.5px; background: var(--panel); color: var(--text); }
  th.gridjs-th { background: var(--panel) !important; color: var(--text-dim) !important; border-color: var(--panel-border) !important; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  td.gridjs-td { background: var(--panel) !important; color: var(--text) !important; border-color: var(--panel-border) !important; }
  .gridjs-pagination { color: var(--text-dim) !important; }
  .gridjs-pagination .gridjs-pages button { background: var(--panel) !important; color: var(--text) !important; border-color: var(--panel-border) !important; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 20px 0; text-align: center; }
  .kpi.money .value { color: var(--accent-4); }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .kpis { grid-template-columns: 1fr 1fr; } }
</style>
</head>

    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmtBRL(ctx.raw) } } },
      scales: {
        x: { beginAtZero: true, grid: { color: '#1A2030' }, ticks: { callback: v => fmtBRL(v) } },
        y: { grid: { display: false } }
      }
    }
  });
  new Chart(document.getElementById('chartLojaQtd'), {
    type: 'bar',
    data: {
      labels: lojaEntries.map(e => e[0]),
      datasets: [{ label: 'Devoluções', data: lojaEntries.map(e => lojaQtd[e[0]]), backgroundColor: '#F5A524', borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      indexAxis: 'y',
      plugins: { legend: { display: false } },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#1A2030' } },
        y: { grid: { display: false } }
      }
    }
  });
} else {
  document.getElementById('chartLojaValor').closest('.grid').innerHTML =
    '<div class="card"><h2>Devolução por loja</h2><div class="empty">Sem devoluções neste mês</div></div>';
}

const skuEntriesAll = Object.entries(skuCounts).sort((a,b) => b[1]-a[1]);
const skuEntries = skuEntriesAll.slice(0, 12);
const skuHint = document.getElementById('sku-hint');
if (skuHint) {
  const totalUnidades = skuEntriesAll.reduce((acc, e) => acc + e[1], 0);
  const somaTop = skuEntries.reduce((acc, e) => acc + e[1], 0);
  skuHint.textContent = skuEntriesAll.length > 12
    ? `Mostrando os 12 SKUs mais devolvidos (${somaTop} de ${totalUnidades} unidades no mês). Outros ${skuEntriesAll.length - 12} SKUs somam ${totalUnidades - somaTop} unidades — veja todos na tabela "Detalhe do mês" abaixo.`
    : `${totalUnidades} unidades devolvidas no mês, distribuídas entre ${skuEntriesAll.length} SKUs.`;
}
if (skuEntries.length) {
  new Chart(document.getElementById('chartSku'), {
    type: 'bar',
    data: {
      labels: skuEntries.map(e => e[0]),
      datasets: [{ label: 'Unidades devolvidas', data: skuEntries.map(e => e[1]), backgroundColor: '#6C8CFF', borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } }, indexAxis: 'y',
      scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#1A2030' } }, y: { grid: { display: false } } }
    }
  });
} else {
  document.getElementById('chartSku').closest('.card').innerHTML = '<h2>SKUs mais devolvidos do mês</h2><div class="empty">Sem devoluções neste mês</div>';
}

if (DATA.month_rows.length) {
  new gridjs.Grid({
    columns: ['Nº Pedido', 'SKU', 'Valor', 'Motivo', 'Comentário', 'Data devolução', 'Estado', 'Plataforma'],
    data: DATA.month_rows.map(r => [
      r['Nº Pedido'], r['SKU'], fmtBRL(Number(r['Valor do Produto (R$)']) || 0), r['Categoria do Motivo'], r['Comentário do Comprador'],
      r['Data/Hora da Devolução'], r['Estado'], r['Plataforma']
    ]),
    sort: true,
    search: { enabled: true, placeholder: 'Ex: 260716TNCDYTXW, SKU ou nome...' },
    pagination: { limit: 10 },
    language: {
      search: { placeholder: 'Ex: 260716TNCDYTXW, SKU ou nome...' },
      pagination: { previous: '‹', next: '›', showing: 'Mostrando', of: 'de', to: 'a', results: () => 'devoluções' },
      noRecordsFound: 'Nenhum pedido encontrado com esse termo',
    },
  }).render(document.getElementById('tabela'));
} else {
  document.getElementById('tabela').innerHTML = '<div class="empty">Nenhuma devolução registrada neste mês</div>';
}
</script>
</body>
</html>
